<style>
  :root { --copper:#B5651D; --copper-l:#E39A54; --ice:#1F8BC9; --bg:#F4F1ED; --card:#fff; --card2:#FAF8F5; --text:#1B1F24; --muted:#646B74; --border:#E6E1DA;
          --green:#15803D; --green-s:#DCFCE7; --amber:#C2410C; --amber-s:#FFEDD5; --red:#DC2626; --red-s:#FEE2E2; --brand:var(--copper); --shadow:0 10px 30px rgba(20,24,29,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E1115; --card:#171C22; --card2:#1C222A; --text:#F2EFEA; --muted:#A3A9B1; --border:#29303A;
          --green:#4ADE80; --green-s:#10301D; --amber:#FB923C; --amber-s:#3A1E0B; --red:#F87171; --red-s:#3A1518; --shadow:0 10px 30px rgba(0,0,0,.35); } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; font-family: -apple-system, 'Segoe UI', Roboto, Inter, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; }
  .wrap { max-width: 720px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 48px; }
  a { color: var(--brand); }
  button { font: inherit; }
  /* Kopf */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 6px 0 14px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:900; font-size:17px; letter-spacing:-.2px; }
  .logo img { width:34px; height:34px; border-radius:9px; }
  .logo b { color: var(--copper); }
  .me { font-size:12px; color: var(--muted); text-align:right; }
  .me button { background:none; border:0; color: var(--muted); text-decoration: underline; cursor:pointer; padding:0; font-size:12px; }
  /* Held */
  .hero { position:relative; overflow:hidden; border-radius: 24px; padding: 22px 20px; color:#fff; margin-bottom: 16px;
          background: radial-gradient(120% 140% at 0% 0%, #2B1A0C 0%, #14181D 55%, #0B2433 100%); box-shadow: var(--shadow); }
  .hero::after { content:''; position:absolute; inset:-40% -20% auto auto; width: 280px; height: 280px; border-radius: 50%;
                 background: radial-gradient(closest-side, rgba(227,154,84,.35), transparent); animation: glow 7s ease-in-out infinite alternate; }
  @keyframes glow { to { transform: translate(-40px, 30px) scale(1.15); } }
  .hero h1 { margin: 0 0 4px; font-size: clamp(22px, 5.5vw, 30px); letter-spacing: -.5px; position: relative; z-index: 1; }
  .hero p { margin: 0; opacity: .85; position: relative; z-index: 1; }
  /* 3 Kacheln immer in einer Reihe — auch auf 320-px-Handys (vorher brach die dritte um) */
  .stats { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px; margin-top: 16px; position: relative; z-index: 1; max-width: 420px; }
  .stat { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 10px 10px; min-width: 0; backdrop-filter: blur(6px); }
  .stat span { display:block; line-height: 1.25; overflow-wrap: anywhere; }
  .stat b { display:block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; opacity: .8; }
  /* Karten */
  .card { background: var(--card); border:1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .site-h { display:flex; justify-content:space-between; align-items:flex-start; gap: 12px; }
  .site-h h2 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
  .site-h .addr { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .firm { display:flex; flex-wrap: wrap; align-items:center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--border); }
  .firm .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 20%, transparent); }
  .firm .nm { font-weight: 800; flex: 1 1 150px; min-width: 0; } /* schmal: Knöpfe rutschen gemeinsam in die 2. Zeile statt den Namen zu quetschen */
  .firm .acts { display:flex; gap: 8px; flex: none; margin-left: auto; }
  .firm .nm small { display:block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .iconbtn { display:inline-flex; align-items:center; justify-content:center; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); text-decoration:none; font-weight: 700; font-size: 14px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 20px 0 10px; }
  /* Anlagen */
  .assets { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .asset { border:1px solid var(--border); border-radius: 16px; padding: 14px; background: var(--card2); display:flex; flex-direction: column; gap: 10px; }
  .asset-h { display:flex; gap: 12px; align-items:center; }
  .ring { position: relative; width: 58px; height: 58px; flex: none; }
  .ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
  .ring .bgc { stroke: var(--border); }
  .ring .fg { stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--to); animation: ringIn 1.2s cubic-bezier(.2,.8,.2,1) .25s both; }
  @keyframes ringIn { from { stroke-dashoffset: var(--c); } }
  .ring .em { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 24px; }
  .asset-h .t { min-width: 0; }
  .asset-h .t b { display:block; font-size: 16px; }
  .asset-h .t span { color: var(--muted); font-size: 13px; }
  .chips { display:flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 99px; background: var(--border); color: var(--text); }
  .chip.ok { background: var(--green-s); color: var(--green); } .chip.soon { background: var(--amber-s); color: var(--amber); } .chip.due { background: var(--red-s); color: var(--red); }
  .actions { display:flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }

  .btn.primary { background: var(--brand); color: #fff; } .btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn.block { width: 100%; min-height: 52px; font-size: 16px; border-radius: 14px; }
  .btn:disabled { opacity: .55; cursor: default; }

  .defect:last-child { border-bottom: 0; }
  .sev { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .sev.red { background: var(--red); } .sev.amber { background: var(--amber); } .sev.green { background: var(--green); }
  /* Verlauf */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content:''; position:absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); border-radius: 2px; }
  .ev { position: relative; padding: 2px 0 14px; }
  .ev::before { content:''; position:absolute; left: -20px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--brand); }
  .ev details summary { list-style: none; cursor: pointer; display:flex; justify-content:space-between; gap: 10px; align-items: baseline; }
  .ev details summary::-webkit-details-marker { display:none; }
  .ev .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .ev .what { font-weight: 800; }
  .ev .what small { display:block; font-weight: 500; color: var(--muted); font-size: 13px; }
  .ev .body { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--border); font-size: 14px; }
  .ev .body p { margin: 0 0 8px; white-space: pre-wrap; }
  .kv { display:grid; grid-template-columns: 1fr auto; gap: 4px 14px; margin: 6px 0 10px; }
  .kv span:nth-child(even) { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .reco { border-left: 4px solid var(--amber); background: var(--amber-s); padding: 8px 10px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; }
  .hash { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  /* Fotos + Unterschriften (erst beim Aufklappen geladen) */
  .media:empty { display: none; }
  .media { margin: 4px 0 12px; }
  .mh { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 12px 0 8px; }
  .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .ph { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; border: 0; background: none; color: var(--muted); font-size: 12px; text-align: left; cursor: zoom-in; min-width: 0; }
  .ph .im { display: block; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--border); border: 1px solid var(--border); }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
  .ph img.ok { opacity: 1; }
  .ph .im.bad { display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 6px; text-align: center; }
  .ph .cap { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph:focus-visible { outline: none; } .ph:focus-visible .im { outline: 2px solid var(--brand); outline-offset: 2px; }
  .signed { margin: 0 0 10px; font-size: 14px; }
  .sigs { display: flex; flex-wrap: wrap; gap: 10px; }
  .sig { margin: 0; flex: 1 1 130px; max-width: 210px; min-width: 0; }
  /* Unterschrift immer auf „Papier“ — dunkle Tinte bleibt auch im Dunkelmodus lesbar */
  .sig .paper { height: 58px; display: flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--border); }
  .sig .paper img { max-width: 100%; max-height: 50px; }
  .sig figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; overflow-wrap: anywhere; }
  .sig figcaption b { color: var(--text); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--brand); text-decoration: underline; cursor: pointer; font: inherit; }
  /* Großansicht */
  .lb { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: rgba(8,10,13,.95); color: #fff; animation: fade .2s ease; }
  .lb-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 12px 6px 16px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lb-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
  .lb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lb-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px; touch-action: pan-y pinch-zoom; }
  .lb-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; user-select: none; -webkit-user-drag: none; transition: opacity .2s ease; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); }
  .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
  .lb-cap { margin: 0; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); text-align: center; font-size: 15px; font-weight: 700; }
  .lb-cap small { display: block; font-weight: 500; font-size: 13px; opacity: .7; }
  /* Anfragen */
  .req { display:flex; justify-content:space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .req:last-child { border-bottom: 0; }
  /* Schalter */
  .switch { display:flex; align-items:center; justify-content:space-between; gap: 14px; padding: 12px; border-radius: 14px; background: var(--card2); border: 1px solid var(--border); margin-top: 14px; }
  .switch input { appearance: none; width: 52px; height: 30px; border-radius: 99px; background: var(--border); position: relative; flex: none; cursor: pointer; transition: background .2s; }
  .switch input::after { content:''; position:absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .switch input:checked { background: var(--green); } .switch input:checked::after { transform: translateX(22px); }
  /* Anmeldung */
  .login { max-width: 440px; margin: 6vh auto 0; }
  .login .card { padding: 24px; }
  label { display:block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  input[type=email], input[type=tel], input[type=text], textarea, select { display:block; width:100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  .otp { display:flex; gap: 8px; justify-content: space-between; }
  .otp input { width: 100%; text-align: center; font-size: 24px; font-weight: 800; padding: 12px 0; }
  .err { color: var(--red); font-weight: 700; font-size: 14px; min-height: 1.2em; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .center { text-align:center; padding: 50px 10px; color: var(--muted); }
  .empty { text-align: center; padding: 30px 12px; }
  .empty .big { font-size: 44px; }
  /* Blatt (Anfrage) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index: 10; animation: fade .2s ease; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; animation: up .28s cubic-bezier(.2,.8,.2,1); }
  .sheet h2 { margin: 4px 0 2px; }
  .seg { display:flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .seg button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); font-weight: 800; cursor: pointer; color: var(--text); }
  .seg button[aria-pressed=true] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--card)); color: var(--brand); }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #14181D; color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow); z-index: 20; animation: up .25s ease; max-width: calc(100% - 32px); }
  .foot { text-align:center; font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.6; }
  .foot a { color: var(--muted); }
  /* Bewegung */
  .in { opacity: 0; animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .skel { height: 14px; border-radius: 7px; background: var(--border); margin: 10px 0; animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } .in { opacity: 1; } }
  /* Drucken: nur das gewählte Protokoll */
  @media print {
    body { background: #fff; color: #000; }
    body.printing .wrap > *:not(#print) { display: none !important; }
    #print { display: block !important; }
    #print .card { box-shadow: none; border: 1px solid #ccc; }
    #print .ph-grid { grid-template-columns: repeat(4, 1fr); }
    #print .ph img { opacity: 1; }
    #print .ph, #print .sig { break-inside: avoid; }
  }
  #print { display: none; }
</style>

<script>
'use strict';
const SUPABASE_URL = 'https://hqudwsxvjhdwfleboklz.supabase.co';       // https://<ref>.supabase.co   (node scripts/einrichten.js trägt es ein)
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxdWR3c3h2amhkd2ZsZWJva2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4ODgyMjQsImV4cCI6MjEwOTQ2NDIyNH0.p5SvVCHjeNGDITr4bZqUgeN9FUXo_YHZo0UVeSYKl0k';      // anon key
const L = window.IDX_LABELS || { kinds: {}, jobs: {}, checks: {}, measures: {} };
const DEMO_MODE = new URLSearchParams(location.search).has('demo');
const KEY = DEMO_MODE ? 'idx.zuhause.demo' : 'idx.zuhause.session'; // Demo-Sitzung nie als echte verwenden
const app = document.getElementById('app');

// ---------------------------------------------------------------------------- Hilfen
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (d) => d ? new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
const fmtT = (d) => d ? new Date(d).toLocaleString('de-AT', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const daysTo = (iso) => {
  if (!iso) return null;
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  const n = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
};
const kindOf = (k) => L.kinds[k] || L.kinds.other || { label: 'Anlage', emoji: '🔧' };
const jobOf = (t) => L.jobs[t] || { label: 'Einsatz', emoji: '📝' };
const checkLabel = (id) => id.startsWith('c:') ? id.slice(2) : (L.checks[id] || id);
const measureOf = (id) => {
  if (id.startsWith('m:')) { const [label, unit] = id.slice(2).split('|'); return { label, unit: unit || '' }; }
  return L.measures[id] || { label: id, unit: '' };
};
const tel = (s) => String(s || '').replace(/[^+0-9]/g, '');
const safeUrl = (u) => /^https?:\/\/[^\s"'<>]+$/i.test(String(u || '')) ? String(u) : '';
const brandOk = (c) => /^#[0-9a-f]{6}$/i.test(String(c || ''));
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch { /* privates Fenster */ } },
};
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

// ---------------------------------------------------------------------------- Anmeldung (Supabase Auth, Code per Mail)
async function auth(path, body, token) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.msg || j.error_description || j.message || 'Fehler'), { status: r.status });
  return j;
}
function keep(s) {
  store.set({ access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (Number(s.expires_in) || 3600) * 1000, email: s.user && s.user.email });
}
async function token() {
  const s = store.get();
  if (!s) return null;
  if (Date.now() < s.expires_at - 60_000) return s.access_token;
  try { keep(await auth('token?grant_type=refresh_token', { refresh_token: s.refresh_token })); return store.get().access_token; }
  catch { store.set(null); return null; }
}
async function rpc(name, body) {
  if (DEMO_MODE) return demoRpc(name, body);
  const t = await token();
  if (!t) throw Object.assign(new Error('Bitte erneut anmelden.'), { status: 401 });
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((j && j.message) || 'Fehler'), { status: r.status });
  return j;
}

function loginView(step, email, msg) {
  app.innerHTML = `

  <div class="login in">

      <h1>Ihre Hausakte.</h1>

    <div class="card">
      ${step === 'email' ? `
        <form id="f1" novalidate>
          <label for="em">Ihre E-Mail-Adresse</label>
          <input id="em" type="email" inputmode="email" autocomplete="email" required value="${esc(email || '')}" placeholder="name@beispiel.at" />
          <p class="muted" style="margin:10px 0 0">Verwenden Sie die Adresse, die Sie Ihrem Fachbetrieb gegeben haben. Wir senden Ihnen einen 6-stelligen Code.</p>

          <button class="btn primary block" id="b1" type="submit">Code senden</button>
        </form>` : `
        <form id="f2" novalidate>
          <p style="margin:0">Wir haben einen Code an <b>${esc(email)}</b> gesendet.</p>
          <label>Code aus der E-Mail</label>
          <div class="otp">${[0,1,2,3,4,5].map((i) => `<input inputmode="numeric" autocomplete="${i === 0 ? 'one-time-code' : 'off'}" maxlength="6" aria-label="Ziffer ${i + 1}" data-i="${i}" />`).join('')}</div>
          <div class="err" id="err">${esc(msg || '')}</div>
          <button class="btn primary block" id="b2" type="submit">Anmelden</button>
          <p class="muted" style="text-align:center;margin:14px 0 0"><button type="button" class="btn ghost" id="back" style="min-height:40px">Andere Adresse</button></p>
        </form>`}
    </div>
    <p class="foot">Ihr Fachbetrieb gibt das Portal für Ihre Adresse frei. <a href="/datenschutz.html#kunden">Datenschutz</a> · <a href="/impressum.html">Impressum</a></p>
  </div>`;
  if (step === 'email') {
    const f = document.getElementById('f1');
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = document.getElementById('em').value.trim().toLowerCase();
      const err = document.getElementById('err');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { err.textContent = 'Bitte eine gültige E-Mail-Adresse eingeben.'; return; }
      const b = document.getElementById('b1'); b.disabled = true; b.textContent = 'Wird gesendet …';
      try {
        if (!DEMO_MODE) await auth('otp', { email: v, create_user: true });
        loginView('code', v);
      } catch (x) {
        b.disabled = false; b.textContent = 'Code senden';
        err.textContent = x.status === 429 ? 'Zu viele Versuche — bitte in einer Minute erneut.' : 'Der Code konnte nicht gesendet werden. Bitte später erneut versuchen.';
      }
    };
  } else {
    const boxes = [...document.querySelectorAll('.otp input')];
    boxes[0].focus();
    boxes.forEach((b, i) => {
      b.addEventListener('input', () => {
        const d = b.value.replace(/\D/g, '');
        if (d.length > 1) { d.split('').slice(0, 6).forEach((c, k) => { if (boxes[k]) boxes[k].value = c; }); boxes[Math.min(5, d.length - 1)].focus(); }
        else { b.value = d; if (d && boxes[i + 1]) boxes[i + 1].focus(); }
        if (boxes.every((x) => x.value)) document.getElementById('f2').requestSubmit();
      });
      b.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
    });
    document.getElementById('back').onclick = () => loginView('email', email);
    document.getElementById('f2').onsubmit = async (e) => {
      e.preventDefault();
      const code = boxes.map((x) => x.value).join('');

        boxes.forEach((x) => (x.value = '')); boxes[0].focus();
      }

function dueState(iso) {
  const d = daysTo(iso);
  if (d === null) return { cls: '', text: 'Noch keine Wartung erfasst', d };
  if (d <= 0) return { cls: 'due', text: `Wartung fällig seit ${fmt(iso)}`, d };
  if (d <= 30) return { cls: 'soon', text: `Wartung in ${d} ${d === 1 ? 'Tag' : 'Tagen'}`, d };
  return { cls: 'ok', text: `Gewartet · nächste bis ${fmt(iso)}`, d };
}
function ring(st, emoji) {
  const C = 2 * Math.PI * 24;
  const frac = st.d === null ? 0 : Math.max(0.04, Math.min(1, st.d / 365));
  const color = st.cls === 'due' ? 'var(--red)' : st.cls === 'soon' ? 'var(--amber)' : st.cls === 'ok' ? 'var(--green)' : 'var(--border)';
  return `<div class="ring" aria-hidden="true"><svg viewBox="0 0 58 58"><circle class="bgc" cx="29" cy="29" r="24" fill="none" stroke-width="5"/>
    <circle class="fg" cx="29" cy="29" r="24" fill="none" stroke-width="5" style="stroke:${color};--c:${C.toFixed(1)};--to:${(C * (1 - frac)).toFixed(1)}"/></svg>
    <span class="em">${esc(emoji)}</span></div>`;
}

// ---------------------------------------------------------------------------- Fotos + Unterschriften (erst beim Aufklappen)
// Fotos liegen im privaten Speicher. Die Seite holt sich je Einsatz kurzlebige signierte Links; der Server prüft
// dabei dieselbe Freigabe wie für die Übersicht (zuhause-fotos.sql). Zugang zurückgenommen → keine neuen Links.
const SIGN_SECONDS = 600;          // signierte Links gelten 10 Minuten
const MEDIA = new Map();           // Einsatz-ID → { raw, photos: [{ src, tag }], sigs: [...], signedAt }
const LOADING = new Map();         // Einsatz-ID → laufendes Laden (Doppelklick, Drucken während des Ladens)
const imgOk = (s) => typeof s === 'string' && (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s) || (DEMO_MODE && s.startsWith('data:image/svg+xml')));

function findJob(id) {
  for (const s of (DATA && DATA.sites) || []) { const j = s.jobs.find((x) => x.id === id); if (j) return { j, s }; }
  return null;
}

async function signPaths(paths) {
  const out = new Map();
  if (!paths.length || DEMO_MODE) return out;
  const t = await token();
  if (!t) throw Object.assign(new Error('Bitte erneut anmelden.'), { status: 401 });
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/photos`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ expiresIn: SIGN_SECONDS, paths }),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !Array.isArray(j)) throw Object.assign(new Error('Fotos nicht freigegeben'), { status: r.status });
  const base = `${SUPABASE_URL}/storage/v1`;
  for (const x of j) {
    const rel = x && !x.error && (x.signedURL || x.signedUrl);
    if (!rel || typeof x.path !== 'string') continue;
    const url = /^https:\/\//i.test(rel) ? rel : base + (rel.startsWith('/') ? '' : '/') + rel;
    if (url.startsWith(`${base}/object/sign/photos/`)) out.set(x.path, url); // nur Links auf den eigenen Speicher
  }
  return out;
}

async function loadMedia(id) {
  if (LOADING.has(id)) return LOADING.get(id);
  const p = (async () => {
    let md = MEDIA.get(id);
    if (!md) {
      const r = await rpc('zuhause_job_media', { p_job: id });
      if (!r || !r.ok) throw Object.assign(new Error('media'), { code: r && r.error });
      // Monteur-Unterschrift kommt bewusst nur als „unterschrieben ja/nein“ (nie als Bild), die eigene als Bild
      const sigs = imgOk(r.customer_signature) ? [{ src: r.customer_signature, name: r.customer_signer }] : [];
      md = { raw: r, photos: [], sigs, signedBy: r.signed === true ? String(r.inspector_name || '').trim() || 'Ihrem Monteur' : '', signedAt: 0 };
      MEDIA.set(id, md);
    }
    // Links kurz vor dem Ablauf neu ausstellen lassen (Seite lange offen)
    if (Date.now() - md.signedAt > (SIGN_SECONDS - 120) * 1000) {
      const raw = Array.isArray(md.raw.photos) ? md.raw.photos : [];
      const urls = await signPaths(raw.map((x) => x && x.path).filter((x) => typeof x === 'string' && x));
      md.photos = raw.map((x) => ({ tag: String((x && x.tag) || '').slice(0, 60), src: x && x.path ? urls.get(x.path) || '' : imgOk(x && x.data) ? x.data : '' }))
        .filter((x) => x.src);
      md.signedAt = Date.now();
    }
    return md;
  })();
  LOADING.set(id, p);
  try { return await p; } finally { LOADING.delete(id); }
}

function mediaHtml(id, md, print) {
  const n = md.photos.length;
  const date = fmt(md.raw.date);
  const ph = n ? `<div class="mh">Fotos (${n})</div><div class="ph-grid">${md.photos.map((p, k) => {
    const cap = p.tag || `Foto ${k + 1}`;
    const img = `<span class="im"><img src="${esc(p.src)}" alt="${esc(cap)}"${print ? ' class="ok"' : ' loading="lazy" decoding="async"'} /></span><span class="cap">${esc(cap)}</span>`;
    return print ? `<figure class="ph">${img}</figure>`
      : `<button type="button" class="ph" data-lb="${esc(id)}" data-n="${k}" aria-label="Foto ${k + 1} von ${n} groß anzeigen: ${esc(cap)}">${img}</button>`;
  }).join('')}</div>` : '';
  const mon = md.signedBy ? `<p class="signed">✍️ Unterschrieben von ${esc(md.signedBy)}, ${esc(date)}</p>` : '';
  const sg = md.sigs.length ? `<div class="sigs">${md.sigs.map((s) => `<figure class="sig">
      <div class="paper"><img src="${esc(s.src)}" alt="Ihre Unterschrift" /></div>
      <figcaption><b>${esc(s.name || 'Ihre Unterschrift')}</b><br>Kunde · ${esc(date)}</figcaption></figure>`).join('')}</div>` : '';
  return ph + (mon || sg ? `<div class="mh">Unterschriften</div>${mon}${sg}` : '');
}

async function showMedia(id, box) {
  if (!box || box.dataset.state === 'done' || box.dataset.state === 'busy') return;
  box.dataset.state = 'busy';
  box.innerHTML = '<div class="skel" style="width:40%"></div><div class="skel" style="height:64px;width:70%"></div>';
  try {
    const md = await loadMedia(id);
    box.innerHTML = mediaHtml(id, md, false);
    box.querySelectorAll('.ph img').forEach((img) => {
      const done = () => img.classList.add('ok');
      if (img.complete && img.naturalWidth) done(); else img.addEventListener('load', done, { once: true });
      img.addEventListener('error', () => { const im = img.parentElement; im.classList.add('bad'); im.textContent = 'Foto nicht verfügbar'; }, { once: true });
    });
    box.onclick = (e) => { const b = e.target.closest('[data-lb]'); if (b) openLightbox(b.dataset.lb, Number(b.dataset.n) || 0, b); };
    box.dataset.state = 'done';
  } catch (x) {
    box.dataset.state = '';
    if (x && x.code === 'unknown') { box.innerHTML = ''; return; } // nicht (mehr) freigegeben
    box.innerHTML = '<p class="muted" style="margin:8px 0">Fotos konnten nicht geladen werden. <button type="button" class="linkbtn">Erneut versuchen</button></p>';
    box.querySelector('.linkbtn').onclick = () => showMedia(id, box);
  }
}

async function openLightbox(id, start, opener) {
  let md;
  try { md = await loadMedia(id); } catch { toast('Fotos konnten nicht geladen werden.'); return; }
  const list = md.photos;
  if (!list.length) return;
  const f = findJob(id);
  const sub = f ? `${jobOf(f.j.type).label} · ${fmt(f.j.started_at)}` : '';
  let k = Math.min(Math.max(0, start), list.length - 1);
  const bg = document.createElement('div');
  bg.className = 'lb';
  bg.setAttribute('role', 'dialog'); bg.setAttribute('aria-modal', 'true'); bg.setAttribute('aria-label', 'Fotos');
  const multi = list.length > 1;
  bg.innerHTML = `<div class="lb-top"><span class="lb-n" aria-live="polite"></span><button type="button" class="lb-btn lb-x" aria-label="Schließen (Esc)">✕</button></div>
    <div class="lb-stage">${multi ? '<button type="button" class="lb-btn lb-nav prev" aria-label="Vorheriges Foto">‹</button>' : ''}
      <img class="lb-img" alt="" draggable="false" />
      ${multi ? '<button type="button" class="lb-btn lb-nav next" aria-label="Nächstes Foto">›</button>' : ''}</div>
    <p class="lb-cap"></p>`;
  const img = bg.querySelector('.lb-img'), cap = bg.querySelector('.lb-cap'), num = bg.querySelector('.lb-n'), stage = bg.querySelector('.lb-stage');
  const show = () => {
    const p = list[k];
    img.src = p.src; img.alt = p.tag || `Foto ${k + 1}`;
    num.textContent = multi ? `${k + 1} / ${list.length}` : '';
    cap.innerHTML = `${esc(p.tag || `Foto ${k + 1}`)}${sub ? `<small>${esc(sub)}</small>` : ''}`;
    if (multi) [list[(k + 1) % list.length], list[(k - 1 + list.length) % list.length]].forEach((x) => { new Image().src = x.src; }); // Nachbarn vorladen
  };
  const go = (d) => { if (!multi) return; k = (k + d + list.length) % list.length; show(); };
  const prevOverflow = document.body.style.overflow;
  const close = () => {
    document.removeEventListener('keydown', onKey);
    document.body.style.overflow = prevOverflow;
    bg.remove();
    if (opener && opener.isConnected) opener.focus();
  };
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key === 'Tab') { // Fokus bleibt in der Großansicht
      const f2 = [...bg.querySelectorAll('button')];
      const i = f2.indexOf(document.activeElement);
      e.preventDefault();
      f2[(i + (e.shiftKey ? -1 : 1) + f2.length) % f2.length].focus();
    }
  }
  bg.querySelector('.lb-x').onclick = close;
  if (multi) { bg.querySelector('.prev').onclick = () => go(-1); bg.querySelector('.next').onclick = () => go(1); }
  // Wischen
  let x0 = null, y0 = 0, swiped = false;
  stage.addEventListener('pointerdown', (e) => { x0 = e.clientX; y0 = e.clientY; swiped = false; });
  stage.addEventListener('pointerup', (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) { swiped = true; go(dx < 0 ? 1 : -1); }
  });
  stage.addEventListener('pointercancel', () => { x0 = null; });
  stage.addEventListener('click', (e) => { if (swiped) { swiped = false; return; } if (e.target === stage) close(); }); // Tippen neben das Foto schließt
  img.addEventListener('error', () => { cap.textContent = 'Dieses Foto ist nicht mehr verfügbar.'; });
  document.addEventListener('keydown', onKey);
  document.body.style.overflow = 'hidden';
  document.body.appendChild(bg);
  show();
  bg.querySelector('.lb-x').focus();
}

function bind() {
  document.querySelectorAll('[data-req]').forEach((b) => (b.onclick = () => openRequest(b.dataset.req, b.dataset.kind)));
  document.querySelectorAll('[data-rem]').forEach((c) => (c.onchange = async () => {
    c.disabled = true;
    try {
      const r = await rpc('zuhause_set_reminders', { p_site: c.dataset.rem, p_on: c.checked });
      if (!r || !r.ok) throw new Error();
      toast(c.checked ? 'Erinnerungen eingeschaltet' : 'Erinnerungen ausgeschaltet');
    } catch { c.checked = !c.checked; toast('Konnte nicht gespeichert werden.'); }
    c.disabled = false;
  }));
  document.querySelectorAll('[data-print]').forEach((b) => (b.onclick = () => printJob(b.dataset.print, b)));
  document.querySelectorAll('details[data-job]').forEach((d) => d.addEventListener('toggle', () => { if (d.open) showMedia(d.dataset.job, d.querySelector('.media')); }));
  document.querySelectorAll('[data-acc]').forEach((b) => (b.onclick = async () => {
    const accept = b.dataset.v === '1';
    b.disabled = true;
    try {
      const r = await rpc('zuhause_decide', { p_org: b.dataset.acc, p_accept: accept });
      if (!r || !r.ok) throw new Error();
      toast(accept ? 'Angenommen ✓' : 'Abgelehnt');
      load();
    } catch { b.disabled = false; toast('Konnte nicht gespeichert werden.'); }
  }));
}

function findAsset(id) {
  for (const s of DATA.sites) { const a = s.assets.find((x) => x.id === id); if (a) return { a, s }; }
  return null;
}

function openRequest(assetId, kind) {
  const f = findAsset(assetId); if (!f) return;
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">

    <div class="seg" role="group" aria-label="Art der Anfrage">
      ${[['maintenance', '🔧 Wartung'], ['fault', '🚨 Störung'], ['quote', '💶 Angebot']].map(([k, t]) => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${t}</button>`).join('')}
    </div>
    <label for="msg">Nachricht</label><textarea id="msg" rows="4" maxlength="2000" placeholder="z. B. Gerät zeigt Fehler F28 / Wartung bitte im März"></textarea>
    <label for="pref">Wunschtermin <span class="muted">(optional)</span></label><input id="pref" type="text" maxlength="200" placeholder="z. B. vormittags, nicht am Freitag" />
    <label for="ph">Telefon für Rückfragen <span class="muted">(optional)</span></label><input id="ph" type="tel" maxlength="40" autocomplete="tel" />

    ${kind === 'fault' ? '<p class="muted" style="color:var(--red);font-weight:700">Gasgeruch? Sofort Gashaupthahn schließen, Fenster öffnen, keine Schalter betätigen und von draußen den Gasnotruf 128 wählen.</p>' : ''}
    <div class="err" id="serr"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost" id="cx" style="flex:1">Abbrechen</button><button class="btn primary" id="sd" style="flex:2">Senden</button></div>
  </div>`;
  document.body.appendChild(bg);
  let k = kind;
  bg.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { k = b.dataset.k; bg.querySelectorAll('[data-k]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));

  document.addEventListener('keydown', function onEsc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); } });
  bg.querySelector('#msg').focus();
  bg.querySelector('#sd').onclick = async () => {
    const btn = bg.querySelector('#sd'); btn.disabled = true; btn.textContent = 'Wird gesendet …';
    try {
      const r = await rpc('zuhause_request', { p_asset: assetId, p_kind: k, p_message: bg.querySelector('#msg').value, p_phone: bg.querySelector('#ph').value, p_preferred: bg.querySelector('#pref').value });
      if (!r || !r.ok) throw Object.assign(new Error(), { code: r && r.error });
      close(); toast('Anfrage gesendet ✓ — Ihr Fachbetrieb meldet sich.');
      load();
    } catch (x) {
      btn.disabled = false; btn.textContent = 'Senden';
      bg.querySelector('#serr').textContent = x.code === 'rate_limited' ? 'Sie haben heute schon mehrere Anfragen gesendet. Bitte rufen Sie Ihren Fachbetrieb an.' : 'Die Anfrage konnte nicht gesendet werden.';
    }
  };
}

async function printJob(id, btn) {
  const f = findJob(id);
  if (!f) return;
  const { j: job, s: site } = f;
  const byId = Object.fromEntries(site.assets.map((a) => [a.id, a]));
  const a = byId[job.item_id];
  if (btn) btn.disabled = true;
  // Fotos + Unterschriften mitdrucken (höchstens kurz warten — Drucken nie blockieren)
  let md = null;
  try { md = await Promise.race([loadMedia(id), new Promise((_, rej) => setTimeout(() => rej(new Error('Zeit')), 6000))]); } catch { md = null; }
  const holder = document.getElementById('print');
  holder.innerHTML = `<div class="card"><h2 style="margin:0">${esc(jobOf(job.type).label)} · ${fmt(job.started_at)}</h2>
    <p class="muted">${esc(site.org && site.org.name || '')} · ${esc(site.name)}${site.address ? ', ' + esc(site.address) : ''}</p>
    ${a ? `<p><b>${esc(a.name)}</b> · ${esc(kindOf(a.kind).label)} ${esc([a.manufacturer, a.model].filter(Boolean).join(' '))}${a.serial_no ? ` · Seriennr. ${esc(a.serial_no)}` : ''}</p>` : ''}
    ${jobItem(job, byId, true)}
    ${md ? mediaHtml(id, md, true) : ''}
    <p class="muted">Monteur: ${esc(job.inspector_name || '—')}${job.customer_signer_name ? ` · unterschrieben von ${esc(job.customer_signer_name)}` : ''}<br>Auszug aus Mein Zuhause — das vollständige Protokoll erhalten Sie von Ihrem Fachbetrieb.</p></div>`;
  // Bilder fertig laden lassen, sonst fehlen sie im PDF
  await Promise.race([
    Promise.all([...holder.querySelectorAll('img')].map((im) => im.complete ? null : new Promise((r) => { im.onload = im.onerror = r; }))),
    new Promise((r) => setTimeout(r, 4000)),
  ]);
  if (btn) btn.disabled = false;
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); }, 60);
}

async function demoRpc(name, body) {
  await new Promise((r) => setTimeout(r, 250));

  if (name === 'zuhause_job_media') {
    const job = DEMO.sites[0].jobs.find((j) => j.id === body.p_job);

      customer_signature: m.cust ? DEMO_SIG_K : null, customer_signer: job.customer_signer_name || null };
  }
  if (name === 'zuhause_set_reminders') { DEMO.sites[0].reminders = !!body.p_on; return { ok: true, reminders: !!body.p_on }; }
  if (name === 'zuhause_decide') { DEMO.pending = DEMO.pending.filter((p) => p.org_id !== body.p_org); return { ok: true, accepted: !!body.p_accept }; }
  if (name === 'zuhause_request') { DEMO.sites[0].requests.unshift({ id: 'r' + Date.now(), asset_id: body.p_asset, kind: body.p_kind, status: 'new', created_at: new Date().toISOString() }); return { ok: true }; }
  return null;
}

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Wartungs-Erinnerung abbestellen · InstallateurDex</title>
<style>
  :root { --copper:#B5651D; --bg:#F6F4F1; --card:#fff; --text:#1B1F24; --muted:#646B74; --border:#E6E1DA; --green:#16A34A; --red:#DC2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1216; --card:#181D23; --text:#F2EFEA; --muted:#A3A9B1; --border:#2A3139; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, 'Segoe UI', Roboto, Inter, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius: 18px; padding: 24px; text-align:center; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 10px 0 6px; } p { color: var(--muted); line-height: 1.5; }
  button { width:100%; border:0; border-radius: 14px; padding: 15px; font: inherit; font-weight: 800; font-size: 16px; background: var(--copper); color:#fff; cursor:pointer; margin-top: 8px; }
  button:disabled { opacity: .6; cursor: default; }
  .note { font-size: 12px; color: var(--muted); text-align:center; margin-top: 18px; } .note a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="box">
  <div style="font-size:40px">🔕</div>
  <h1>Wartungs-Erinnerungen abbestellen?</h1>
  <p>Sie bekommen dann keine Erinnerungs-Mails mehr zur Wartung Ihrer Anlage. Ihr Anlagenpass und Ihre Unterlagen bleiben erhalten.</p>
  <button id="go" type="button">Ja, abbestellen</button>
</div>
<div class="note">Erstellt mit <a href="https://installateurdex.dexware.app">InstallateurDex</a></div></div>
<script>
// Gleiche öffentliche Werte wie in /a/index.html (nach USER-TODO eintragen).
const SUPABASE_URL = '';
const SUPABASE_ANON = '';
const box = document.getElementById('box');
const t = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
const show = (emoji, title, text) => { box.innerHTML = `<div style="font-size:40px">${emoji}</div><h1>${title}</h1><p>${text}</p>`; };
if (!/^[0-9a-f]{32}$/.test(t)) show('🔧', 'Link ungültig', 'Dieser Abmelde-Link ist unvollständig. Bitte öffnen Sie ihn direkt aus der Mail.');
document.getElementById('go')?.addEventListener('click', async (e) => {
  e.target.disabled = true;
  if (t === '0'.repeat(32)) return show('✅', 'Abbestellt', 'Beispiel — es wurde nichts geändert.');
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/reminder_unsubscribe`, {
      method: 'POST', headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: t }),
    });
    const ok = r.ok && (await r.json()) === true;
    if (!ok) return show('🔧', 'Nicht gefunden', 'Zu diesem Link gibt es keine Erinnerung (mehr). Vielleicht wurde sie schon abbestellt.');
    show('✅', 'Abbestellt', 'Sie bekommen keine Wartungs-Erinnerungen mehr. Ihr Fachbetrieb kann Sie nicht von sich aus wieder eintragen.');
    const undo = document.createElement('button');
    undo.type = 'button';
    undo.textContent = 'Versehentlich? Doch weiter erinnern';
    undo.style.cssText = 'background:transparent;color:var(--copper);border:2px solid var(--copper)';
    undo.addEventListener('click', async () => {
      undo.disabled = true;
      try {
        const c = await fetch(`${SUPABASE_URL}/rest/v1/rpc/reminder_confirm`, {
          method: 'POST', headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_token: t }),
        });
        const j = c.ok ? await c.json() : null;
        j && j.ok ? show('🔔', 'Wieder angemeldet', 'Sie bekommen wieder Wartungs-Erinnerungen. Abbestellen geht jederzeit über den Link in jeder Mail.')
                  : (undo.disabled = false);
      } catch { undo.disabled = false; }
    });
    box.appendChild(undo);
  } catch { e.target.disabled = false; show('📶', 'Keine Verbindung', 'Bitte später erneut versuchen.'); }
});
</script>
</body>
</html>
